target-version = "py314"
line-length = 100

[lint]
select = [
    "ERA", "YTT", "ANN", "ASYNC", "S", "BLE", "B", "A", "COM", "C4", "DTZ", "T10",
    "FIX", "FA", "INT", "ISC", "ICN", "LOG", "G", "PIE", "T20", "PYI", "Q", "RSE",
    "RET", "SIM", "SLOT", "TID", "TD", "TC", "ARG", "PTH", "FLY", "I", "C90", "N",
    "PERF", "E", "W", "D", "F", "PGH", "PL", "UP", "FURB", "RUF",
]
ignore = [
    "ANN401", "S101", "S603", "S607", "PYI011", "PYI021", "PYI029", "PYI044", "TC006",
    "D100", "D101", "D104", "D105", "D106", "D107", "D202", "D203", "D212", "D401",
    "D406", "D407", "D408", "D409", "D410", "D411", "D413", "PGH003", "PLR0904",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR6301", "PLW0603", "PLW2901",
    "FURB140", "FURB167",
    # COM812 conflicts with `ruff format`, which owns trailing commas
    "COM812",
]

[lint.per-file-ignores]
"**/__init__.py" = ["E402"]
"build_sdkmods.py" = ["T201"]
